[workspace]
members = [
  "apps/cli",
  "crates/core"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Bhimesh Patil"]
repository = "https://github.com/bhimeshpatil1/copy-for-ai"

[workspace.dependencies]
copy-for-ai-core = { path = "crates/core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }